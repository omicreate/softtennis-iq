<!doctype html>
<!-- SNS・LINE で共有したときに出る画像（1200×630）の原稿。npm run ogp で public/ogp.png に書き出す -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Outfit:wght@600;800&display=block" />
    <style>
      * { margin: 0; box-sizing: border-box; }
      body { width: 1200px; height: 630px; background: #0e1a2b; color: #fff; font-family: 'Noto Sans JP', sans-serif; overflow: hidden; position: relative; }
      /* 右側にコートを大きく敷く（動画と同じ緑とライン） */
      .court { position: absolute; right: -40px; top: -60px; width: 560px; height: 760px; transform: rotate(8deg); }
      .wrap { position: absolute; left: 72px; top: 64px; width: 640px; display: grid; gap: 28px; }
      .brand { display: flex; align-items: center; gap: 18px; font-weight: 900; font-size: 34px; letter-spacing: 0.02em; }
      .ball { width: 54px; height: 54px; border-radius: 50%; background: radial-gradient(circle at 34% 30%, #f6ffc4 0 14%, #d8f04a 46%, #b9d22f 100%); }
      h1 { font-size: 66px; font-weight: 900; line-height: 1.22; letter-spacing: -0.01em; }
      h1 em { font-style: normal; color: #d8f04a; }
      .tools { display: flex; gap: 14px; margin-top: 8px; }
      .tool { background: #1b2f4b; border-radius: 16px; padding: 14px 18px; font-size: 24px; font-weight: 900; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
      .tool i { width: 14px; height: 14px; border-radius: 50%; background: #d8f04a; display: block; }
      .tool:nth-child(2) i { background: #f4e04d; }
      .tool:nth-child(3) i { background: #fff; border-radius: 3px; }
      .foot { position: absolute; left: 72px; bottom: 52px; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 26px; color: #b8c6d6; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <svg class="court" viewBox="0 0 200 340" aria-hidden="true">
      <defs>
        <pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="6" height="6" fill="#0e1a2b" /><line x1="0" y1="0" x2="0" y2="6" stroke="#ff7a6b" stroke-width="2" opacity=".5" />
        </pattern>
      </defs>
      <rect width="200" height="340" fill="#1f5a42" rx="6" />
      <rect width="200" height="170" fill="url(#h)" opacity=".9" />
      <polygon points="22,10 178,10 160,170 68,170" fill="#2a7656" />
      <rect x="40" y="10" width="120" height="320" fill="none" stroke="#fff" stroke-width="1.6" />
      <line x1="54" y1="10" x2="54" y2="330" stroke="#fff" />
      <line x1="146" y1="10" x2="146" y2="330" stroke="#fff" />
      <line x1="54" y1="97" x2="146" y2="97" stroke="#fff" />
      <line x1="54" y1="243" x2="146" y2="243" stroke="#fff" />
      <line x1="100" y1="97" x2="100" y2="243" stroke="#fff" />
      <line x1="30" y1="170" x2="170" y2="170" stroke="#0e1a2b" stroke-width="3.5" />
      <line x1="70" y1="300" x2="22" y2="10" stroke="#d8f04a" stroke-width="1.6" />
      <line x1="70" y1="300" x2="178" y2="10" stroke="#d8f04a" stroke-width="1.6" />
      <line x1="70" y1="300" x2="100" y2="10" stroke="#d8f04a" stroke-dasharray="4 4" />
      <rect x="50" y="28" width="15" height="15" rx="3" fill="#fff" />
      <rect x="120" y="148" width="15" height="15" rx="3" fill="#fff" />
      <circle cx="70" cy="300" r="8" fill="#f4e04d" />
      <circle cx="128" cy="196" r="8" fill="#f4e04d" />
    </svg>
    <div class="wrap">
      <div class="brand"><span class="ball"></span>ソフトテニスIQ</div>
      <h1>動画で見た戦術を、<br /><em>コートの外でも。</em></h1>
      <div class="tools">
        <span class="tool"><i></i>ルールドリル</span>
        <span class="tool"><i></i>陣形ラボ</span>
        <span class="tool"><i></i>試合ノート</span>
      </div>
    </div>
    <p class="foot">@softtennis_iq　無料・登録なし</p>
  </body>
</html>
